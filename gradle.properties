android.useAndroidx=true

# Tech PoC P6 (Task 1): the Gradle daemon repeatedly died in JVM Metaspace during
# lint's Kotlin FIR analysis (lintVital* on the new benchmark variants). Host has
# ample RAM; raise the daemon metaspace/heap so lint and K2 UAST can run.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
