<meta charset="UTF-8">
<div id="record-f0-review">
  <style>

    #record-f0-review .rf-notice { margin: 16px 0; }
    #record-f0-review .rf-notice p { margin: 3px 0 8px; }
    #record-f0-review .rf-filters { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 4px; }
    #record-f0-review .rf-filters button[aria-pressed="true"] { color: #FFFFFF; background: var(--rf-blue); }
    #record-f0-review .rf-date { font-size: .875em; color: var(--rf-muted); margin: 24px 0 6px; }
    #record-f0-review .rf-entry { display: block; width: 100%; text-align: left; background: var(--rf-surface); border-radius: 16px; margin: 8px 0; padding: 16px; }
    #record-f0-review button.rf-entry { padding: 16px; background: var(--rf-surface); font-weight: 400; }
    #record-f0-review .rf-entry-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 8px; font-weight: 600; }
    #record-f0-review .rf-money { font-variant-numeric: tabular-nums; white-space: nowrap; }

    #record-f0-review .rf-field { display: block; margin-bottom: 18px; }
    #record-f0-review .rf-field > span { display: block; font-size: .875em; color: var(--rf-muted); margin-bottom: 6px; }
    #record-f0-review .rf-field input, #record-f0-review .rf-field textarea, #record-f0-review .rf-field select { display: block; width: 100%; color: var(--rf-ink); background: var(--rf-surface); font: inherit; line-height: 1.5; border: 1px solid var(--rf-muted); border-radius: 12px; padding: 12px; caret-color: var(--rf-ink); min-height: 48px; }
    #record-f0-review .rf-field input::placeholder, #record-f0-review .rf-field textarea::placeholder { color: var(--rf-muted); opacity: 1; }
    #record-f0-review .rf-field textarea { resize: vertical; min-height: 180px; }
    #record-f0-review .rf-field input.rf-amount-input { font-size: 2.5em; line-height: 1.2; font-variant-numeric: tabular-nums; }
    #record-f0-review .rf-note { line-height: 1.8; white-space: pre-wrap; }
    #record-f0-review .rf-footer { padding: 16px 20px 22px; border-top: 1px solid var(--rf-line); display: flex; gap: 10px; flex-wrap: wrap; }
    #record-f0-review .rf-footer button { flex: 1 1 100px; }
    #record-f0-review .rf-stage button.rf-assistant { position: absolute; right: 12px; bottom: 106px; width: 52px; height: 52px; border-radius: 50%; background: var(--rf-blue); color: #FFFFFF; touch-action: none; display: flex; justify-content: center; align-items: center; gap: 8px; border: 2px solid #FFFFFF; }
    #record-f0-review button.rf-assistant:hover { background: var(--rf-blue); }
    #record-f0-review .rf-eye { width: 4px; height: 9px; border-radius: 4px; background: #FFFFFF; }
    #record-f0-review .rf-message { margin: 20px 0; }
    #record-f0-review .rf-message.rf-user { margin-left: 30px; background: var(--rf-surface); padding: 14px; border-radius: 16px; }
    #record-f0-review .rf-link { text-decoration: underline; text-underline-offset: 3px; text-align: left; }
    #record-f0-review .rf-composer { display: flex; align-items: flex-end; gap: 8px; margin-top: 24px; }
    #record-f0-review .rf-composer .rf-field { margin: 0; flex: 1; }
    #record-f0-review .rf-composer textarea { min-height: 76px; }
    #record-f0-review .rf-sheet { background: var(--rf-surface); margin: 22px -20px -24px; padding: 20px; border-radius: 24px 24px 0 0; }
    #record-f0-review .rf-sheet .rf-field input, #record-f0-review .rf-sheet .rf-field textarea { background: var(--rf-page); }
    #record-f0-review .rf-sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--rf-muted); margin: 0 auto 16px; }
    #record-f0-review .rf-demo-feedback { color: inherit; text-align: center; font-size: 14px; min-height: 24px; padding-top: 14px; }
    #record-f0-review .rf-palette { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 12px 0; }
    #record-f0-review .rf-swatch { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--rf-muted); }
    @media (max-width: 360px) { #record-f0-review .rf-body { padding-inline: 16px; } #record-f0-review .rf-controls { gap: 8px; } #record-f0-review .rf-appbar { padding-inline: 10px; } }
    @media (prefers-reduced-motion: no-preference) { #record-f0-review .rf-stage button { transition: background-color 180ms ease-out; } }
  </style>
  <p class="rf-caption">F0-C1 · 设计候选 · 全部为合成示例，操作不保存真实数据</p>
  <div class="rf-controls" aria-label="设计审阅控制">
    <label>主题<select id="rf-theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <label>页面<select id="rf-page"></select></label>
    <label>状态<select id="rf-state"></select></label>
    <label>文字<select id="rf-scale"><option value="normal">标准</option><option value="large">放大 125%</option></select></label>
    <label>预览宽度<select id="rf-width"><option value="390">390dp</option><option value="320">320dp</option><option value="412">412dp</option></select></label>
  </div>
  <div class="rf-stage" id="rf-stage" data-theme="light" data-scale="normal" aria-label="Record 原生界面候选">
    <div class="rf-statusbar"><span>9:41</span><span>Record</span></div>
    <div id="rf-screen"></div>
  </div>
  <div class="rf-demo-feedback" id="rf-feedback" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const root = document.getElementById('record-f0-review');
      const stage = root.querySelector('#rf-stage');
      const screen = root.querySelector('#rf-screen');
      const pageSelect = root.querySelector('#rf-page');
      const stateSelect = root.querySelector('#rf-state');
      const feedback = root.querySelector('#rf-feedback');
      const pages = {
        timeline: ['时间线', ['正常','空白','加载中','读取失败','翻页失败']],
        finance: ['记账 / 编辑', ['正常','校验失败','发现草稿','草稿保存失败','离开确认','保存中','保存失败','结果未知','版本冲突']],
        detail: ['收支详情', ['正常','读取失败']],
        note: ['笔记阅读', ['正常','关联只读预览','删除确认','删除中','删除失败','已删除']],
        editor: ['笔记编辑', ['已保存','尚未保存','保存中','保存失败','清空正文','版本冲突','离开确认']],
        links: ['双向关联', ['正常','无候选','加载中','读取失败','保存中','版本冲突','离开确认']],
        ai: ['AI 聊天面板', ['待确认','回答','导航','待补充','处理中','请求失败','已中断','未启用','缺凭据','授权撤销']],
        proposal: ['原生提案确认', ['待确认','编辑提案','原生草稿冲突','提交中','结果未知','版本冲突','已保存']],
        settings: ['设置', ['正常','AI 已关闭','缺凭据']],
        authorization: ['Provider 授权', ['未授权','凭据配置','凭据不可用']],
        history: ['会话历史', ['正常','空白','删除确认','待核查提交']],
        backup: ['完整备份 / 恢复', ['正常','导出确认','导出中','导出失败','校验中','恢复确认','恢复中','恢复失败','恢复后']],
        deleted: ['已删除笔记', ['正常','空白','只读预览','恢复中','恢复失败']]
      };
      let current = 'timeline';
      let selectedState = '正常';
      let filter = '全部';
      let assistantVisible = true;
      let navStack = [];
      let financeDirty = false;
      let linkDirty = false;
      let financeBuffer = { amount:'58.00', time:'2026-10-24T12:30', memo:'午饭', category:'餐饮', direction:'支出' };
      let linkSelection = [true,false];
      const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const action = (text, name, kind = '') => `<button type="button" class="${kind}" data-action="${name}">${text}</button>`;
      const tag = (text, saved = false) => `<span class="rf-tag${saved ? ' rf-saved' : ''}">${text}</span>`;
      const notice = (title, text, buttons = '') => `<div class="rf-notice" role="status">${tag(title)}<p>${text}</p>${buttons}</div>`;
      const field = (label, content) => `<label class="rf-field"><span>${label}</span>${content}</label>`;
      const row = (label, content) => `<div class="rf-row"><div>${label}</div>${content}</div>`;
      const actions = content => `<div class="rf-actions">${content}</div>`;
      const record = (title, amount, extra, target) => `<button type="button" class="rf-entry" data-action="${target}"><span class="rf-entry-top"><span>${title}</span><span class="rf-money">${amount}</span></span><span class="rf-muted rf-small">${extra}</span></button>`;
      const noteBody = '和同学讨论课程项目。\n\n午饭时确定了分工：先把记录与关联做好，再逐步接入 AI。\n\n先完成一件具体的事。';
      let noteBuffer = noteBody;
      let proposalBuffer = '和同学讨论课程项目。';
      let proposalRevision = 3;
      function header(title, right = action('设置','settings')) {
        return `<div class="rf-appbar">${current === 'timeline' ? '<strong>记录</strong>' : action('返回','back')}${current === 'timeline' ? action('10月24日','date','rf-link') : `<strong>${title}</strong>`}${right}</div>`;
      }
      function nav(page, state) {
        if (pages[page]) {
          navStack.push([current, selectedState]);
          current = page;
          selectedState = state || pages[page][1][0];
          sync();
        }
      }
      function sync() {
        pageSelect.value = current;
        stateSelect.replaceChildren(...pages[current][1].map(value => new Option(value,value)));
        stateSelect.value = selectedState;
        render();
      }
      function render() {
        let title = pages[current][0], body = '', footer = '', right = action('首页','home');
        const s = selectedState;
        if (current === 'timeline') {
          right = action('设置','settings');
          body = `<div class="rf-filters" aria-label="记录类型">${['全部','收支','笔记'].map(f => `<button type="button" data-filter="${f}" aria-pressed="${filter === f}">${f}</button>`).join('')}</div>`;
          if (s === '空白') body += '<div class="rf-panel"><h2>还没有记录</h2><p class="rf-muted">记下一笔收支，或写下此刻的想法。</p></div>';
          else if (s === '加载中') body += '<p role="status">正在加载记录…</p>';
          else if (s === '读取失败') body += notice('记录加载失败','已有数据未被更改。请重试读取。',action('重试读取','retry','rf-secondary'));
          else {
            body += '<p class="rf-date">今天 · 10月24日</p>';
            if (filter !== '笔记') body += record('支出 · 午饭','−¥58.00','12:30 · 餐饮 · 关联 1 篇笔记','detail');
            if (filter !== '收支') body += record('笔记','','12:20 · 和同学讨论课程项目。 · 关联 1 笔收支','note');
            if (filter !== '笔记') body += '<p class="rf-date">昨天 · 10月23日</p>' + record('收入 · 兼职','+¥200.00','18:00 · 未分类','detail');
            if (s === '翻页失败') body += notice('更多记录加载失败','当前列表已保留。',action('重试加载更多','retry','rf-secondary'));
          }
          body += `<p class="rf-muted rf-small">按发生时间排列</p>${assistantVisible ? '' : action('显示助手','show-assistant','rf-link')}`;
          footer = action('记账','finance','rf-primary') + action('写笔记','editor','rf-secondary');
        }
        if (current === 'finance') {
          title = '记一笔';
          body = `<div class="rf-filters" aria-label="收支方向">${['支出','收入'].map(d => `<button type="button" data-direction="${d}" aria-pressed="${financeBuffer.direction === d}">${d}</button>`).join('')}</div>`;
          if (s === '发现草稿') body += notice('有一份未完成的草稿','支出 ¥58.00 · 午饭。草稿尚未成为正式记录。',actions(action('继续草稿','continue-draft','rf-primary')+action('放弃草稿','discard-draft','rf-secondary')));
          body += field('金额 · CNY',`<input aria-label="金额" data-finance-field="amount" class="rf-amount-input" inputmode="decimal" value="${s === '校验失败' ? '58.001' : escape(financeBuffer.amount)}">`);
          if (s === '校验失败') body += '<p role="alert">金额最多保留两位小数，请修改后保存。</p>';
          body += field('发生时间',`<input data-finance-field="time" type="datetime-local" value="${escape(financeBuffer.time)}">`) + field('账户','<select><option>默认账户</option></select>') + field('分类 · 可不选',`<select data-finance-field="category">${['餐饮','未分类'].map(c => `<option${financeBuffer.category === c ? ' selected' : ''}>${c}</option>`).join('')}</select>`) + field('说明',`<input data-finance-field="memo" value="${escape(financeBuffer.memo)}">`);
          if (s === '草稿保存失败') body += notice('草稿尚未保存','输入仍在当前页面。请重试，或继续编辑。',action('重试保留草稿','retry','rf-secondary'));
          if (s === '保存失败') body += notice('保存失败','输入已保留，正式记录未被改动。',action('重试保存','save-finance','rf-secondary'));
          if (s === '版本冲突') body += notice('记录已变化','本地输入已保留。请查看最新记录，重新审核后再保存。',action('查看最新记录','detail','rf-secondary'));
          if (s === '结果未知') body += notice('正在核查保存结果','保存回执未到达，请先核查同一记录。不要重复新建。');
          if (s === '离开确认') body += `<div class="rf-sheet">${tag('有尚未完成的输入')}<p>请选择如何处理这份记账草稿。</p><div class="rf-stack">${action('继续编辑','continue-finance','rf-primary')}${action('保留草稿并离开','leave-with-draft','rf-secondary')}${action('放弃输入','leave-without-draft','rf-secondary')}</div></div>`;
          const locked = s === '保存中' || s === '结果未知' || s === '版本冲突';
          body += actions(`<button type="button" class="rf-primary" data-action="save-finance" ${locked ? 'disabled' : ''}>${s === '保存中' ? '正在保存…' : s === '结果未知' ? '正在核查…' : '保存记录'}</button>`);
        }
        if (current === 'detail') {
          title = '收支详情'; right = action('编辑','finance');
          body = s === '读取失败' ? notice('详情加载失败','请重试，不会打开空编辑器。',action('重试读取','retry','rf-secondary')) : `<p class="rf-muted">支出</p><div class="rf-amount">¥58.00</div><div class="rf-panel">${row('发生时间','<span>10月24日 12:30</span>')}${row('账户','<span>默认账户</span>')}${row('分类','<span>餐饮</span>')}${row('说明','<span>午饭</span>')}</div><h2>关联笔记</h2>${record('和同学讨论课程项目','','10月24日 12:20','note')}${action('管理关联','links','rf-link')}`;
        }
        if (current === 'note') {
          title = '笔记'; right = action('编辑','editor');
          body = `<p class="rf-muted rf-small">10月24日 12:20</p><p class="rf-note">${noteBody}</p><h2>关联收支</h2>${record('支出 · 午饭','−¥58.00','10月24日 12:30','detail')}${action('管理关联','links','rf-link')}${actions(action('更多：删除笔记','delete-confirm','rf-secondary'))}`;
          if (s === '删除确认') body += `<div class="rf-sheet">${tag('删除笔记')}<p>笔记将从时间线及关联列表隐藏，可在已删除笔记中恢复。</p>${actions(action('取消','cancel-delete','rf-secondary')+action('删除笔记','delete-note','rf-primary'))}</div>`;
          if (s === '删除中') body = '<p role="status">正在删除笔记…</p><p class="rf-muted">请等待提交结果。</p>';
          if (s === '删除失败') body += notice('删除失败','笔记正文和关联均保持原状。',action('重试删除','delete-confirm','rf-secondary'));
          if (s === '已删除') { right = action('首页','home'); body = notice('笔记已删除','正文与原关联仍保留，可从专用入口恢复。',action('查看已删除笔记','deleted','rf-secondary')); }
          if (s === '关联只读预览') { right='';body=`${tag('关联选择中的只读预览')}<p class="rf-muted rf-small">返回后保留未提交勾选。</p><p class="rf-note">${noteBody}</p>${action('返回选择','back','rf-secondary')}`; }
        }

        if (a === 'hide-assistant') { assistantVisible=false; nav('timeline'); return; }
        if (a === 'show-assistant') { assistantVisible=true; render(); return; }
        if (a === 'edit-proposal') { setState('编辑提案'); return; }
        if (['keep-draft','discard-native-draft'].includes(a)) { setState('待确认'); return; }
        if (a === 'revise-proposal') {proposalRevision++;setState('待确认');return;}
        if (a === 'confirm-proposal') { setState('已保存'); feedback.textContent='仅演示 Applied 后的界面，未提交真实业务。'; return; }
        if (a === 'disable-ai') { setState('AI 已关闭'); return; }
        if (a === 'grant-ai') { setState('凭据配置'); feedback.textContent='仅演示授权后的配置页，未授予真实 Provider 权限。'; return; }
        if (a === 'save-credential') { feedback.textContent='审阅稿不保存凭据。请勿输入真实 Key。'; return; }
        if (a === 'delete-session') { setState('删除确认'); return; }
        if (a === 'cancel-session-delete') { setState('正常'); return; }
        if (a === 'confirm-session-delete') { setState('空白'); feedback.textContent='仅演示删除后的会话列表，未删除真实历史。'; return; }
        const states = {'export-confirm':'导出确认','export-start':'导出中','cancel-export':'正常','restore-check':'校验中','restore-start':'恢复中','cancel-restore':'正常'};
        if (states[a]) { setState(states[a]); return; }
        if (a === 'restore-note') { feedback.textContent='仅演示恢复后的同一笔记，未修改真实数据。'; nav('note'); return; }
      });
      root.addEventListener('input',e => {
        if (e.target.dataset.financeField) { financeBuffer[e.target.dataset.financeField]=e.target.value; financeDirty=true; }
        if (e.target.hasAttribute('data-proposal-field')) proposalBuffer=e.target.value;
        if (current === 'editor' && e.target.tagName === 'TEXTAREA') {
          noteBuffer=e.target.value;
          selectedState='尚未保存'; stateSelect.value=selectedState;
          const t=screen.querySelector('.rf-tag'); if (t) {t.textContent='尚未保存';t.classList.remove('rf-saved');}
        }
      });
      root.addEventListener('change',e => {
        if (e.target.hasAttribute('data-link-index')) {linkSelection[Number(e.target.dataset.linkIndex)]=e.target.checked;linkDirty=true;}
        if (e.target.dataset.financeField) {financeBuffer[e.target.dataset.financeField]=e.target.value;financeDirty=true;}
        if (e.target.matches('[data-theme-control]')) { const value=e.target.value==='system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : e.target.value; stage.dataset.theme=value; root.querySelector('#rf-theme').value=value; }
      });
      Object.entries(pages).forEach(([value,[label]]) => pageSelect.add(new Option(label,value)));
      pageSelect.addEventListener('change',() => { current=pageSelect.value; selectedState=pages[current][1][0]; navStack=[]; sync(); });
      stateSelect.addEventListener('change',() => { selectedState=stateSelect.value; render(); });
      root.querySelector('#rf-theme').addEventListener('change',e => {stage.dataset.theme=e.target.value;render();});
      root.querySelector('#rf-scale').addEventListener('change',e => {stage.dataset.scale=e.target.value;});
      root.querySelector('#rf-width').addEventListener('change',e => {stage.style.setProperty('--rf-preview-width',e.target.value+'px');});
      sync();
    })();
  </script>
</div>
